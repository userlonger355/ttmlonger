name: Native ARM64 Android container test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/navigation-metadata-20261124
    paths:
      - .github/workflows/arm64-container.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check native ARM64 Binder support
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          [[ "$(uname -m)" == aarch64 ]]
          if ! grep -qw binder /proc/filesystems && ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            if apt-cache show "linux-modules-extra-$(uname -r)" >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y "linux-modules-extra-$(uname -r)"
              sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
            fi
          fi
          if ! grep -qw binder /proc/filesystems && [[ ! -c /dev/binder ]]; then
            echo "::error::No usable Android Binder driver; container cannot boot"
            exit 1
          fi
          echo "Binder support detected"
      - name: Install ADB and start isolated native Android
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y adb
          docker pull redroid/redroid:14.0.0-latest
          docker image inspect redroid/redroid:14.0.0-latest --format '{{.Architecture}} {{.Id}}'
          [[ "$(docker image inspect redroid/redroid:14.0.0-latest --format '{{.Architecture}}')" == arm64 ]]
          docker run -d --name native-android --privileged -p 127.0.0.1:5555:5555 redroid/redroid:14.0.0-latest androidboot.redroid_gpu_mode=guest androidboot.use_memfd=true
          adb connect 127.0.0.1:5555
          for attempt in $(seq 1 60); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if [[ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi
              [[ "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" == arm64-v8a ]]
              echo "### Native ARM64 Android booted" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Android did not finish booting"
          docker logs --tail 80 native-android
          exit 1
      - name: Clean up isolated container
        if: always()
        run: docker rm -f native-android || true

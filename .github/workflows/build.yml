name: Build TTMLonger

# Работает в двух вариантах:
#  1) в репозитории лежат файлы проекта как есть;
#  2) в корне репозитория лежит один файл ttmlonger.zip — он распакуется сам.
# Тестовый APK доступен в Actions → Artifacts. Публикация релиза выполняется отдельно.
on:
  workflow_dispatch:
  push:
    # правка общего списка бейджиков не должна запускать сборку
    paths-ignore:
      - badges.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Найти проект
        run: |
          if [ -f ttmlonger.zip ]; then unzip -oq ttmlonger.zip; fi
          if [ -d ttmlonger/app ]; then
            echo "PROJECT=ttmlonger" >> "$GITHUB_ENV"
          else
            echo "PROJECT=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TTMLonger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TTMLonger
          path: ${{ env.PROJECT }}/TTMLonger.apk

      - name: Publish alpha module APK
        if: github.ref == 'refs/heads/fix/navigation-metadata-20261124'
        working-directory: ${{ env.PROJECT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="module-alpha-${GITHUB_RUN_ID}"
          gh release create "$tag" TTMLonger.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TTMLonger 0.1 — module" --notes "LSPatch/Xposed module only. Not a standalone TikTok APK. Commit: $GITHUB_SHA" --prerelease --latest=false

      - name: Record build provenance
        working-directory: ${{ env.PROJECT }}
        run: |
          sha256sum TTMLonger.apk > TTMLonger.apk.sha256
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build-info.txt
          echo "### Test build only — runtime acceptance is separate" >> "$GITHUB_STEP_SUMMARY"
          cat TTMLonger.apk.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: TTMLonger-build-info
          path: |
            ${{ env.PROJECT }}/TTMLonger.apk.sha256
            ${{ env.PROJECT }}/build-info.txt
          if-no-files-found: error

  ui-preview:
    name: Проверить меню и снять экраны Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Собрать временное приложение для проверки экранов
        run: |
          cp tools/ui-preview/*.java app/src/main/java/dev/ttmlonger/
          sed -i '/<application/,/supportsRtl=/ { /supportsRtl=/a\            <activity android:name="dev.ttmlonger.PreviewActivity" android:exported="true" />
          }' app/src/main/AndroidManifest.xml
          sed -i 's/compileOnly(project/implementation(project/' app/build.gradle.kts
          gradle --no-daemon :app:assembleDebug
      - name: Разрешить эмулятору использовать KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          script: bash tools/ui-preview/capture.sh
      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: TTMLonger-preview
          path: |
            screenshots/*.png
          if-no-files-found: error
